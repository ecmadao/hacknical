server {
    listen 80;
    listen [::]:80;
    server_name hack.r2049.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://hackneo.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hack.r2049.cn;

    ssl_certificate /etc/nginx/cert/hack.r2049.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/hack.r2049.cn/hack.r2049.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        return 301 https://hackneo.cn$request_uri;
    }
}
