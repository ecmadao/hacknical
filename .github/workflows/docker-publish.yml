name: CI and Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hacknical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint and OAuth regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build-app
      - run: npm test
      - name: Check deployment scripts
        run: |
          bash -n scripts/deploy-image.sh
          python3 -m py_compile scripts/configure-deploy.py

  image:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    needs: image
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: hacknical-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ vars.SSH_HOST_FINGERPRINT }}
          APP_URL: ${{ vars.APP_URL }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER SSH_PRIVATE_KEY SSH_HOST_FINGERPRINT APP_URL DEPLOY_PATH; do
            if [ -z "${!name}" ]; then echo "Missing $name" >&2; exit 1; fi
          done
      - name: Upload deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          fingerprint: ${{ vars.SSH_HOST_FINGERPRINT }}
          source: docker-compose.deploy.yml,scripts/deploy-image.sh,scripts/configure-deploy.py,config/production.example.json
          target: ${{ vars.DEPLOY_PATH }}
      - name: Pull and deploy the verified image
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HACKNICAL_IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: ${{ vars.APP_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.HACKNICAL_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.HACKNICAL_GITHUB_OAUTH_CLIENT_SECRET }}
          GITHUB_OAUTH_REDIRECT_URI: ${{ vars.HACKNICAL_GITHUB_OAUTH_REDIRECT_URI }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          fingerprint: ${{ vars.SSH_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH,HACKNICAL_IMAGE,GHCR_USER,GHCR_TOKEN,APP_URL,APP_KEY,GITHUB_OAUTH_CLIENT_ID,GITHUB_OAUTH_CLIENT_SECRET,GITHUB_OAUTH_REDIRECT_URI
          command_timeout: 10m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            bash scripts/deploy-image.sh
      - name: Check public HTTPS endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 15 "${APP_URL%/}/api/healthz"
